[pytest]
testpaths = tests
markers =
    ui: browser-driven UI tests (Playwright); run with `pytest -m ui --no-cov`
# Default run = backend tests with 100% line+branch coverage enforced.
# UI tests are selected explicitly with `-m ui` (the last -m wins) and run without coverage.
addopts = -m "not ui" --cov=app --cov-branch --cov-report=term-missing:skip-covered --cov-report=xml
